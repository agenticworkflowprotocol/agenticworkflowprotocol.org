# Builds the website (site/) and runs its checks. It does not deploy: Cloudflare Pages builds and
# serves agenticworkflowprotocol.org from main itself, GitHub Pages is not used.
# Uses GitHub-hosted runners only.
name: pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'site/**'
      - 'spec/**'
      - 'docs/**'
      - 'schema/**'
      - 'conformance/**'
      - 'CHANGELOG.md'
      - 'CNAME'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      # Conformance suite: the examples rendered on the site must stay valid.
      - name: Conformance suite
        run: |
          npm ci
          npm test

      - name: Install site dependencies (install scripts disabled by .npmrc)
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      - name: Link check (offline)
        working-directory: site
        run: npm run check:links

      - name: Size budget
        working-directory: site
        run: npm run check:budget

      - name: Accessibility check (axe-core, WCAG 2.2 AA, no external requests)
        working-directory: site
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run check:a11y
